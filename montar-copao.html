<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/favicon.ico" sizes="48x48">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="img/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B30A08">
<title>Monte seu Copão — Adega Zé Beer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="topbar">
      <div class="container topbar__linha">
        <span class="icone" data-icone="mapPin"></span>
        <span id="topbar-cidade">Santa Cruz das Palmeiras - SP</span>
      </div>
    </div>
    <div class="cabecalho">
      <div class="container cabecalho__linha">
        <a href="index.html" class="marca">Zé Beer</a>
        <a href="carrinho.html" class="btn-sacola" aria-label="Ver cesta">
          <span class="icone" data-icone="basket"></span>
          <span data-cesta-valor>R$ 0,00</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container pagina-monte">
    <button type="button" class="btn btn-preto" style="margin-bottom: var(--sp-4);" onclick="history.back()">
      <span class="icone" data-icone="chevronLeft"></span> Voltar
    </button>
    <h1 class="pagina-monte__titulo">Monte seu Copão</h1>

    <div class="cartao-promo" style="margin-bottom: var(--sp-4);">
      <div class="cartao-promo__banner"><img src="https://placehold.co/700x350/B30A08/B30A08?text=%20" alt=""></div>
    </div>
    <div class="caixa-info" id="caixa-info-copao">Copo 770ml<br>Energético<br>Gelo saborizado</div>

    <div id="carregando-copao">
      <div class="skeleton-carrossel"><div class="skeleton skeleton-cartao"></div><div class="skeleton skeleton-cartao"></div></div>
    </div>

    <div id="conteudo-copao" hidden>
      <h2 class="secao__titulo">Selecione 1 Copão</h2>
      <div class="bloco-carrossel">
        <div class="bloco-carrossel__pista" id="pista-copoes"></div>
      </div>

      <div class="bloco-radio" style="margin-top: var(--sp-5);">
        <h3>Escolha o energético</h3>
        <div id="lista-energeticos"></div>
      </div>

      <div class="bloco-radio">
        <h3>Escolha o gelo</h3>
        <div id="lista-gelos-copao"></div>
      </div>
    </div>

    <div class="estado-vazio" id="copao-vazio" hidden>
      <div class="estado-vazio__icone">🥤</div>
      <h3>Nenhum copão disponível no momento</h3>
      <p>Volte mais tarde ou fale com a loja.</p>
    </div>
  </main>

  <div class="barra-acoes-fixa">
    <button type="button" class="btn btn-primario" id="btn-continuar-comprando">Continuar comprando</button>
    <button type="button" class="btn btn-preto" id="btn-finalizar-pedido" disabled>Finalizar Pedido</button>
  </div>

  <script src="js/icons.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/montar-copao.js"></script>
</body>
</html>
